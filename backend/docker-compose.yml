services:
  mysql:
    image: mysql:8.4
    container_name: nrityasana-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nrityasana
      MYSQL_USER: nrityasana
      MYSQL_PASSWORD: nrityasana-dev-password
      MYSQL_ROOT_PASSWORD: root-dev-password
    ports:
      - "3306:3306"
    volumes:
      - nrityasana_mysql_data:/var/lib/mysql

volumes:
  nrityasana_mysql_data:
