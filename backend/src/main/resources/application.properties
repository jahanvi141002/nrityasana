# Nrityasana Spring Boot & MySQL JDBC Configuration
spring.application.name=nrityasana-api

# MySQL DataSource / JDBC Connection
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nrityasana?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:nrityasana}
spring.datasource.password=${MYSQL_PASSWORD:nrityasana-dev-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Spring SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Server Port
server.port=8080
