# Nrityasana Spring Boot & MySQL JDBC Configuration
spring.application.name=nrityasana-api
server.port=8080

# MySQL DataSource / JDBC Connection
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/nrityasana?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL Initialization (Executes schema.sql and seed data on startup)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql

# JWT & Authentication
app.jwt.secret=${JWT_SECRET:-l!|!P!%(OW@:3OXuX[I=A=[b;hhN@*QpnwU87L{,q+}
app.jwt.expiration-hours=24
app.google.client-id=${GOOGLE_CLIENT_ID:398078052902-mrfkdb14ni3ql7hgkb8n49luh81nito4.apps.googleusercontent.com}
app.admin-email=${ADMIN_EMAIL:admin@nrityasana.com}

# File Uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# WhatsApp Business Cloud API Integration
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v21.0}
app.whatsapp.default-recipient=${WHATSAPP_DEFAULT_RECIPIENT:}

